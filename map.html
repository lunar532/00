<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 · Underlume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  html, body { height: 100%; }
  body { min-height: 0; display: grid; grid-template-rows: auto 1fr; }
  .site-header { position: static; }
  .map-app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
  #map { min-height: 0; background: #040b2c; }
  .side { overflow-y: auto; border-left: 1px solid var(--line); background: rgba(6, 14, 48, 0.92); padding-block: 18px 28px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
  .side h2 { font-family: var(--font-ko-display); font-size: 19px; }
  .side .form { gap: 10px; }
  .coords { font-family: var(--font-mono); font-size: 12px; color: var(--uv-cyan); }
  .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .results button { width: 100%; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--text); }
  .results button:hover { border-color: var(--line-hi); }
  .places { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .places li button { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; text-align: left; background: rgba(2, 5, 26, 0.5); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--text); }
  .places li button:hover { border-color: var(--line-hi); }
  .places .dot { grid-row: span 2; width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
  .places .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .places .sub { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* 지도 타일을 사파이어빛 밤 지도로 */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) saturate(0.75) brightness(0.82) contrast(0.95); }
  .leaflet-container { font-family: var(--font-body); }
  .leaflet-control-attribution { background: rgba(2, 5, 26, 0.75) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--uv-cyan) !important; }
  .leaflet-bar a { background: #0a1640 !important; color: var(--text) !important; border-color: var(--line) !important; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0a1640; color: var(--text); border: 1px solid var(--line-hi); box-shadow: 0 0 24px rgba(139, 77, 255, 0.45); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .pop { display: grid; gap: 6px; min-width: 180px; }
  .pop b { font-family: var(--font-ko-display); font-size: 16px; }
  .pop .sub { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .pop .row { gap: 6px; }

  .pin { position: relative; display: block; width: 22px; height: 22px; }
  .pin i { position: absolute; inset: 5px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c), 0 0 22px var(--c); }
  .pin::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--c); opacity: 0.7; animation: ping 2.4s ease-out infinite; }
  .pin.pending i { background: #fff; box-shadow: 0 0 12px #fff; }
  @keyframes ping { from { transform: scale(0.6); opacity: 0.9; } to { transform: scale(2.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pin::before { animation: none; } }

  dialog { width: min(1100px, calc(100vw - 24px)); height: min(820px, calc(100vh - 24px)); padding: 0; border: 1px solid var(--line-hi); border-radius: 14px; background: #040b2c; color: var(--text); box-shadow: 0 0 60px rgba(139, 77, 255, 0.45); }
  dialog::backdrop { background: rgba(2, 5, 26, 0.75); backdrop-filter: blur(4px); }
  dialog[open] { display: grid; grid-template-rows: auto 1fr; }
  .dlg-head { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .dlg-head b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-ko-display); font-size: 17px; }
  dialog iframe { width: 100%; height: 100%; border: 0; display: block; }

  @media (max-width: 820px) {
    html, body { height: auto; }
    body { display: block; }
    .map-app { grid-template-columns: minmax(0, 1fr); }
    #map { height: 60vh; min-height: 340px; }
    .side { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    dialog { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body data-page="map">
<header id="site-header" data-compact="1"></header>

<div class="map-app">
  <div id="map" aria-label="장소 지도"></div>

  <aside class="side">
    <div style="display:grid;gap:6px">
      <h2>장소에 3D 모델 놓기</h2>
      <p class="hint">3D 파일을 실제 위치에 놓고, 핀을 눌러 3D로 봐요. 이 브라우저에만 저장돼요.</p>
    </div>

    <form class="form" id="add-form">
      <div class="field"><label for="p-name">이름</label><input class="input" id="p-name" maxlength="60" required placeholder="예: 우리 집, 동네 공원 정자"></div>
      <div class="field"><label for="p-kind">종류</label>
        <select class="input" id="p-kind"><option>집</option><option>공원</option><option>건물</option><option>기타</option></select>
      </div>
      <div class="field"><label for="p-files">3D 파일 (GLB 추천 · OBJ는 .mtl과 이미지도 함께)</label><input class="input" id="p-files" type="file" multiple required></div>
      <div class="field"><label for="p-note">메모</label><input class="input" id="p-note" maxlength="200" placeholder="선택"></div>
      <div class="field">
        <label for="p-search">위치 (지도를 누르거나 주소로 찾기)</label>
        <div class="row" style="flex-wrap:nowrap"><input class="input" id="p-search" placeholder="주소나 장소 이름"><button class="btn small" type="button" id="search-btn">찾기</button></div>
        <ul class="results" id="results"></ul>
        <div class="row"><span class="coords" id="coords">아직 위치를 고르지 않았어요</span><span class="spacer"></span><button class="btn small ghost" type="button" id="here-btn">내 위치</button></div>
      </div>
      <p class="msg" id="add-msg"></p>
      <button class="btn primary" type="submit" id="add-btn">지도에 놓기</button>
    </form>

    <div style="display:grid;gap:8px">
      <h2 style="font-size:16px">놓아 둔 장소 <span class="tag" id="count">0</span></h2>
      <ul class="places" id="places"></ul>
    </div>
  </aside>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlg-title"></b><a class="btn small ghost" id="dlg-open" href="#" target="_blank" rel="noopener">크게 열기</a><button class="btn small" type="button" id="dlg-close">닫기</button></div>
  <iframe id="dlg-frame" title="3D 모델"></iframe>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/places-db.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = { '집': '#63f0ff', '공원': '#6dffc4', '건물': '#8b4dff', '기타': '#ff4fd8' };
const MODEL_EXT = ['glb', 'gltf', 'usdz', 'fbx', 'obj', 'ply', 'stl'];
const extOf = n => (n.split('.').pop() || '').toLowerCase();

const map = L.map('map', { zoomControl: true }).setView([37.5444, 127.0374], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자',
}).addTo(map);

const icon = (color, pending) => L.divIcon({
  className: '', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -10],
  html: `<span class="pin ${pending ? 'pending' : ''}" style="--c:${color}"><i></i></span>`,
});

let pending = null, pendingMarker = null;
const markers = new Map();

function setPending(lat, lng) {
  pending = { lat, lng };
  $('coords').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  if (!pendingMarker) pendingMarker = L.marker([lat, lng], { icon: icon('#fff', true), draggable: true }).addTo(map)
    .on('dragend', e => { const p = e.target.getLatLng(); setPending(p.lat, p.lng); });
  else pendingMarker.setLatLng([lat, lng]);
}
map.on('click', e => setPending(e.latlng.lat, e.latlng.lng));

$('here-btn').addEventListener('click', () => {
  if (!navigator.geolocation) return say('이 브라우저는 위치 기능이 없어요.', 'error');
  navigator.geolocation.getCurrentPosition(
    p => { setPending(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 17); },
    () => say('위치를 가져오지 못했어요. 브라우저에서 위치 권한을 허용해 주세요.', 'error'),
    { enableHighAccuracy: true, timeout: 10000 });
});

async function search() {
  const q = $('p-search').value.trim();
  const ul = $('results');
  if (!q) return;
  ul.innerHTML = '<li class="hint">찾는 중…</li>';
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=ko&q=' + encodeURIComponent(q));
    const list = await res.json();
    if (!list.length) { ul.innerHTML = '<li class="hint">찾지 못했어요. 다르게 적어 보거나 지도를 직접 눌러 주세요.</li>'; return; }
    ul.innerHTML = '';
    list.forEach(r => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = r.display_name;
      b.addEventListener('click', () => { const lat = +r.lat, lng = +r.lon; setPending(lat, lng); map.setView([lat, lng], 17); ul.innerHTML = ''; });
      li.append(b); ul.append(li);
    });
  } catch (e) { ul.innerHTML = '<li class="msg error">주소 검색이 안 돼요. 잠시 뒤에 다시 해 보세요.</li>'; }
}
$('search-btn').addEventListener('click', search);
$('p-search').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); search(); } });

function say(text, kind) { const m = $('add-msg'); m.className = 'msg ' + (kind || ''); m.textContent = text; }

$('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const files = [...$('p-files').files];
  if (!files.some(f => MODEL_EXT.includes(extOf(f.name)))) return say('3D 파일(GLB, OBJ, PLY, STL, FBX, USDZ)을 하나 이상 골라 주세요.', 'error');
  if (!pending) return say('지도를 눌러서 위치를 먼저 골라 주세요.', 'error');
  $('add-btn').disabled = true;
  const place = {
    id: ULPlaces.newId(), name: $('p-name').value.trim(), kind: $('p-kind').value, note: $('p-note').value.trim(),
    lat: pending.lat, lng: pending.lng, created: Date.now(),
    files: files.map(f => ({ name: f.name, type: f.type, blob: f })),
  };
  try {
    await ULPlaces.put(place);
    say(`${place.name}을(를) 지도에 놓았어요.`, 'ok');
    $('add-form').reset(); pending = null; $('coords').textContent = '아직 위치를 고르지 않았어요';
    if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
    await refresh();
    openPopup(place.id);
  } catch (err) {
    say('저장하지 못했어요. 브라우저 저장 공간이 부족할 수 있어요. (' + err.message + ')', 'error');
  } finally { $('add-btn').disabled = false; }
});

function popupHtml(p) {
  return `<div class="pop">
    <b>${UL.esc(p.name)}</b>
    <span class="sub">${UL.esc(p.kind)} · ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>
    ${p.note ? `<span>${UL.esc(p.note)}</span>` : ''}
    <div class="row"><button class="btn small primary" type="button" data-view="${p.id}">3D로 보기</button>
    ${p.id !== 'sample' ? `<button class="btn small danger" type="button" data-del="${p.id}">지우기</button>` : ''}</div>
    ${p.id !== 'sample' ? '<span class="sub">핀을 끌어서 위치를 옮길 수 있어요</span>' : ''}
  </div>`;
}

let places = [];
async function refresh() {
  let saved = [];
  try { saved = await ULPlaces.all(); } catch (e) { say('이 브라우저에서는 장소를 저장할 수 없어요 (개인정보 보호 모드일 수 있어요).', 'error'); }
  places = [ULPlaces.SAMPLE, ...saved.sort((a, b) => a.created - b.created)];
  markers.forEach(m => map.removeLayer(m)); markers.clear();
  places.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: icon(COLORS[p.kind] || COLORS['기타']), draggable: p.id !== 'sample', title: p.name })
      .addTo(map).bindPopup(() => popupHtml(p));
    if (p.id !== 'sample') m.on('dragend', async ev => {
      const ll = ev.target.getLatLng(); p.lat = ll.lat; p.lng = ll.lng;
      await ULPlaces.put(p); renderList();
    });
    markers.set(p.id, m);
  });
  renderList();
}
function renderList() {
  $('count').textContent = places.length;
  const ul = $('places'); ul.innerHTML = '';
  places.forEach(p => {
    const li = document.createElement('li');
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<span class="dot" style="background:${COLORS[p.kind] || COLORS['기타']};box-shadow:0 0 8px ${COLORS[p.kind] || COLORS['기타']}"></span><span class="nm"></span><span class="sub">${UL.esc(p.kind)} · ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>`;
    b.querySelector('.nm').textContent = p.name;
    b.addEventListener('click', () => openPopup(p.id));
    li.append(b); ul.append(li);
  });
}
function openPopup(id) {
  const m = markers.get(id); if (!m) return;
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
  m.openPopup();
}

// 팝업 안 버튼
document.getElementById('map').addEventListener('click', async e => {
  const v = e.target.closest('[data-view]'), d = e.target.closest('[data-del]');
  if (v) openModel(v.dataset.view);
  if (d) {
    if (d.dataset.armed !== '1') { d.dataset.armed = '1'; d.textContent = '한 번 더 누르면 지워져요'; return; }
    await ULPlaces.remove(d.dataset.del); map.closePopup(); refresh();
  }
});

function openModel(id) {
  const p = places.find(x => x.id === id); if (!p) return;
  const url = 'viewer.html?place=' + encodeURIComponent(id);
  $('dlg-title').textContent = p.name;
  $('dlg-open').href = url;
  $('dlg-frame').src = url + '&embed=1';
  $('dlg').showModal();
}
$('dlg-close').addEventListener('click', () => $('dlg').close());
$('dlg').addEventListener('close', () => { $('dlg-frame').src = 'about:blank'; });

refresh().then(() => {
  if (places.length > 1) map.fitBounds(L.latLngBounds(places.map(p => [p.lat, p.lng])).pad(0.3), { maxZoom: 16 });
});
</script>
</body>
</html>
