<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빛마루</title>
<meta name="description" content="누르면 피어나고, 끌면 흐르는 밤의 잉크. 3D 집 뷰어, 지도, 게시판.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .stage { position: relative; border-radius: 4px; overflow: hidden; height: min(82vh, 760px); min-height: 520px; background: #0a0307; isolation: isolate; }
  #garden { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .stage-copy { position: absolute; left: clamp(20px, 5vw, 64px); bottom: clamp(84px, 14vh, 140px); pointer-events: none; display: grid; gap: 14px; max-width: 620px; color: #f6e7ee; }
  .stage-copy .kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(246, 231, 238, 0.6); margin: 0; }
  .stage-copy h1 { font-family: var(--font-serif); font-weight: 300; font-size: clamp(40px, 7vw, 88px); line-height: 1.04; letter-spacing: -0.03em; }
  .stage-copy h1 em { font-family: 'Cormorant Garamond', var(--font-serif); font-style: italic; font-weight: 400; color: #ffb3cc; }
  .stage-copy p { margin: 0; font-size: 15px; color: rgba(246, 231, 238, 0.72); font-weight: 300; }
  .rail {
    position: absolute; left: clamp(20px, 5vw, 64px); right: clamp(20px, 5vw, 64px); bottom: 22px;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid rgba(246, 231, 238, 0.16); color: rgba(246, 231, 238, 0.7);
    font-size: 13px;
  }
  .rail .seg { display: inline-flex; gap: 14px; }
  .rail button { background: none; border: 0; padding: 4px 0; color: rgba(246, 231, 238, 0.55); font-size: 13px; letter-spacing: 0.04em; border-bottom: 1px solid transparent; }
  .rail button:hover { color: #f6e7ee; }
  .rail button[aria-pressed="true"] { color: #f6e7ee; border-bottom-color: #ff8fb1; }
  .rail .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(246, 231, 238, 0.4); }

  .verse { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; padding-block: 24px; border-bottom: 1px solid var(--line); }
  .verse .q { margin: 0; font-family: var(--font-serif); font-weight: 300; font-size: clamp(22px, 3.4vw, 36px); line-height: 1.4; letter-spacing: -0.02em; min-height: 2.8em; }
  .verse .btn { font-weight: 400; }

  .index { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .index a { display: grid; gap: 10px; align-content: start; padding: 26px 22px 30px 0; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--line); position: relative; }
  .index a + a { padding-left: 22px; border-left: 1px solid var(--line); }
  .index .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.2em; }
  .index h3 { font-family: var(--font-serif); font-weight: 400; font-size: 24px; letter-spacing: -0.02em; transition: color .3s; }
  .index p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.7; font-weight: 300; }
  .index a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .5s cubic-bezier(.2, .7, .2, 1); }
  .index a + a::after { left: 22px; }
  .index a:hover h3 { color: var(--accent); }
  .index a:hover::after { transform: scaleX(1); }

  .latest ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .latest li a { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); min-width: 0; }
  .latest li a:hover .t { color: var(--accent); }
  .latest .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .latest .m { color: var(--muted); font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }

  @media (max-width: 900px) {
    .index { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .index a:nth-child(3) { padding-left: 0; border-left: 0; }
    .index a:nth-child(3)::after { left: 0; }
  }
  @media (max-width: 520px) {
    .index { grid-template-columns: minmax(0, 1fr); }
    .index a, .index a + a { padding-left: 0; border-left: 0; }
    .index a + a::after { left: 0; }
    .verse { grid-template-columns: minmax(0, 1fr); }
    .stage-copy { bottom: 132px; }
  }
</style>
</head>
<body data-page="index">
<header id="site-header"></header>

<main class="shell">
  <section class="stage" id="garden-wrap" aria-label="밤의 잉크">
    <canvas id="garden" aria-label="누르면 잉크가 피어나고, 끌면 손끝을 따라 흘러요"></canvas>
    <div class="stage-copy">
      <p class="kicker">Bitmaru — Nocturne</p>
      <h1 id="site-name">천천히,<br><em>번지게.</em></h1>
      <p id="garden-hint">누르면 피어나고, 끌면 흐릅니다.</p>
    </div>
    <div class="rail" role="toolbar" aria-label="잉크 도구">
      <span class="label">Tone</span>
      <div class="seg" role="group" aria-label="색" id="pal-seg">
        <button type="button" data-pal="rose" aria-pressed="true">로즈</button>
        <button type="button" data-pal="amber" aria-pressed="false">앰버</button>
        <button type="button" data-pal="velvet" aria-pressed="false">벨벳</button>
      </div>
      <span class="spacer"></span>
      <button type="button" id="bloom-btn">피우기</button>
      <button type="button" id="sound-btn" aria-pressed="false">소리 켜기</button>
      <button type="button" id="clear-btn">지우기</button>
    </div>
  </section>

  <section class="verse" aria-live="polite">
    <p class="q" id="promise"></p>
    <button class="btn ghost small" type="button" id="promise-btn">다음 문장</button>
  </section>

  <nav class="index" aria-label="메뉴">
    <a href="viewer.html"><span class="n">01</span><h3>3D 뷰어</h3><p>스캔한 공간을 열고, 걷고, 재고, 벽에 사진을 겁니다.</p></a>
    <a href="map.html"><span class="n">02</span><h3>지도</h3><p>모델을 실제 장소에 두고, 핀을 눌러 들어갑니다.</p></a>
    <a href="board.html"><span class="n">03</span><h3>게시판</h3><p>글과 댓글을 남깁니다.</p></a>
    <a href="refs.html"><span class="n">04</span><h3>참고자료</h3><p>들를 때마다 바뀌는 GitHub 추천 코드 열 개.</p></a>
  </nav>

  <section class="latest" id="latest-panel">
    <div class="row"><h2 class="section-title">새 글</h2><span class="spacer"></span><a href="board.html">전체 보기</a></div>
    <div id="latest"><p class="hint">불러오는 중…</p></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/garden.js"></script>
<script>
const LINES = [
  '서두르지 않아도, 밤은 우리 편이다.',
  '가장 깊은 색은 천천히 스며든다.',
  '닿은 자리마다 온기가 남는다.',
  '말하지 않아도 번지는 것들이 있다.',
  '빛은 어둠이 있어야 비로소 보인다.',
  '조용한 것이 가장 오래 남는다.',
];
let li = Math.floor(Math.random() * LINES.length);
const qEl = document.getElementById('promise');
const show = () => { qEl.textContent = LINES[li]; };
document.getElementById('promise-btn').addEventListener('click', () => { li = (li + 1) % LINES.length; show(); });
show();

(async () => {
  const box = document.getElementById('latest');
  if (!UL.configured) { document.getElementById('latest-panel').hidden = true; return; }
  const s = await UL.getSettings();
  if (s && s.notice) document.getElementById('garden-hint').textContent = s.notice;
  const { data, error } = await UL.client.from('posts').select('id, title, author_name, created_at').order('created_at', { ascending: false }).limit(5);
  if (error) { box.innerHTML = `<p class="msg error">글을 불러오지 못했어요: ${UL.esc(error.message)}</p>`; return; }
  if (!data.length) { box.innerHTML = '<p class="hint">아직 글이 없어요.</p>'; return; }
  box.innerHTML = '<ul>' + data.map(p => `<li><a href="board.html?id=${p.id}"><span class="t">${UL.esc(p.title)}</span><span class="m">${UL.esc(p.author_name)} · ${UL.fmtDate(p.created_at)}</span></a></li>`).join('') + '</ul>';
})();
</script>
</body>
</html>
