<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빛마루</title>
<meta name="description" content="닿으면 피고, 끌면 끈적하게 흐르는 밤의 정원">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .garden-wrap { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 520px; height: min(72vh, 680px); }
  #garden { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .garden-copy { position: absolute; left: 28px; top: 26px; right: 28px; pointer-events: none; display: grid; gap: 8px; max-width: 560px; }
  .garden-copy h1 { font-weight: 800; font-size: clamp(32px, 5.6vw, 60px); line-height: 1.05; color: #fff0f5; text-shadow: 0 0 30px rgba(255, 77, 141, 0.55), 0 2px 0 rgba(0, 0, 0, 0.25); }
  .garden-copy p { margin: 0; color: #f3c9d8; font-size: 15px; }
  .garden-copy .eyebrow { color: #ffb766; }
  .tools {
    position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 8px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--text) 6%, transparent); }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface-solid); color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding: 0 6px; }
  .toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: var(--surface-solid); border: 1px solid var(--line); font-size: 13px; box-shadow: var(--shadow); }

  .promise { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .promise .q { font-size: clamp(18px, 2.4vw, 22px); font-weight: 500; line-height: 1.5; margin: 0; min-height: 3em; display: flex; align-items: center; }
  .promise .dot { width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(from 0deg, var(--aurora-1), var(--aurora-3), var(--aurora-2), var(--aurora-4), var(--aurora-1)); animation: spin 14s linear infinite; box-shadow: 0 0 24px color-mix(in srgb, var(--aurora-3) 70%, transparent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .doors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .door {
    --mx: 50%; --my: 0%;
    position: relative; display: grid; gap: 10px; align-content: start; min-height: 170px; padding: 22px;
    text-decoration: none; color: var(--text); border-radius: var(--radius); overflow: hidden;
    background: radial-gradient(260px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%), var(--surface);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    transition: transform .25s, border-color .25s;
  }
  .door:hover { transform: translateY(-4px); border-color: var(--line-hi); color: var(--text); }
  .door .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .door .ic svg { width: 22px; height: 22px; }
  .door h3 { font-size: 18px; font-weight: 800; }
  .door p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  .door .go { margin-top: auto; font-size: 13px; color: var(--accent); font-weight: 600; }

  .latest ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .latest li a { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); min-width: 0; }
  .latest li a:hover .t { color: var(--accent); }
  .latest .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .latest .m { color: var(--muted); font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }

  @media (max-width: 900px) { .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) {
    .doors { grid-template-columns: minmax(0, 1fr); }
    .garden-wrap { height: auto; min-height: 0; display: grid; grid-template-rows: 440px auto; }
    #garden { position: relative; grid-row: 1; }
    .tools { position: static; grid-row: 2; margin: 8px; border-radius: 16px; }
    .garden-copy { left: 18px; right: 18px; top: 18px; }
    .promise { grid-template-columns: auto minmax(0, 1fr); }
    .promise .btn { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) { .promise .dot { animation: none; } }
</style>
</head>
<body data-page="index">
<header id="site-header"></header>

<main class="shell">
  <section class="garden-wrap" id="garden-wrap" data-time="day" aria-label="빛의 정원">
    <canvas id="garden" aria-label="화면을 누르면 그 자리에 빛나는 꽃이 피어나요"></canvas>
    <div class="garden-copy">
      <p class="eyebrow">빛마루 · 밤에 피는 정원</p>
      <h1 id="site-name">닿으면 피어나요</h1>
      <p id="garden-hint">누르면 꽃이 피고, 천천히 끌면 꿀처럼 끈적한 빛이 흘러내려요.</p>
    </div>
    <div class="toast" id="toast" hidden></div>
    <div class="tools" role="toolbar" aria-label="정원 도구">
      <div class="seg" role="group" aria-label="꽃 종류" id="kind-seg">
        <button type="button" data-kind="0" aria-pressed="true">별꽃</button>
        <button type="button" data-kind="1" aria-pressed="false">이슬꽃</button>
        <button type="button" data-kind="2" aria-pressed="false">나선꽃</button>
      </div>
      <div class="seg" role="group" aria-label="분위기" id="time-seg">
        <button type="button" data-time="dawn" aria-pressed="false">장밋빛</button>
        <button type="button" data-time="day" aria-pressed="true">벨벳</button>
        <button type="button" data-time="dusk" aria-pressed="false">와인</button>
        <button type="button" data-time="night" aria-pressed="false">자정</button>
      </div>
      <button class="btn small" type="button" id="sound-btn" aria-pressed="false">소리 켜기</button>
      <button class="btn small" type="button" id="wind-btn">바람</button>
      <button class="btn small" type="button" id="plant-btn">꽃 심기</button>
      <span class="spacer"></span>
      <span class="count" id="count">0송이</span>
      <button class="btn small ghost" type="button" id="clear-btn">비우기</button>
      <button class="btn small primary" type="button" id="share-btn">내 정원 링크 복사</button>
    </div>
  </section>

  <section class="panel promise" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <p class="q" id="promise"></p>
    <button class="btn small" type="button" id="promise-btn">다른 문장</button>
  </section>

  <section class="doors" aria-label="메뉴" id="doors">
    <a class="door" href="viewer.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></span>
      <h3>3D 뷰어</h3><p>폰으로 스캔한 집 파일을 열고, 평면도·걸어보기·치수 재기·벽에 사진 걸기를 해요.</p><span class="go">열기 →</span>
    </a>
    <a class="door" href="map.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>
      <h3>지도</h3><p>3D 모델을 실제 장소에 놓고, 핀을 눌러 바로 둘러봐요.</p><span class="go">열기 →</span>
    </a>
    <a class="door" href="board.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
      <h3>게시판</h3><p>글과 댓글로 이야기를 나눠요.</p><span class="go">열기 →</span>
    </a>
    <a class="door" href="refs.html">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></span>
      <h3>참고자료</h3><p>GitHub 추천 코드 10개. 들를 때마다 바뀌어요.</p><span class="go">열기 →</span>
    </a>
  </section>

  <section class="panel latest" id="latest-panel">
    <div class="row"><h2 class="section-title">새 글</h2><span class="spacer"></span><a href="board.html">전체 보기</a></div>
    <div id="latest"><p class="hint">불러오는 중…</p></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/garden.js"></script>
<script>
// 오늘의 문장 (빛마루의 약속)
const PROMISES = [
  '서두르지 마. 밤은 길어.',
  '가장 진한 향은 늦게 피는 꽃에서 난다.',
  '빛은 천천히, 아주 천천히 번진다.',
  '닿는 순간 피어나는 것들이 있다.',
  '달콤한 건 언제나 조금씩 흘러내린다.',
  '이 정원에선 아무도 시간을 재지 않는다.',
  '온기는 가까이 있을 때 가장 선명하다.',
  '오늘 밤의 빛은 오늘 밤에만 핀다.',
];
let pi = Math.floor(Math.random() * PROMISES.length);
const pEl = document.getElementById('promise');
function showPromise() { pEl.textContent = PROMISES[pi]; }
document.getElementById('promise-btn').addEventListener('click', () => { pi = (pi + 1 + Math.floor(Math.random() * (PROMISES.length - 1))) % PROMISES.length; showPromise(); });
showPromise();

// 카드 위에 손가락·마우스를 따라가는 빛
document.querySelectorAll('.door').forEach(d => d.addEventListener('pointermove', e => {
  const r = d.getBoundingClientRect();
  d.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  d.style.setProperty('--my', (e.clientY - r.top) + 'px');
}));

// 새 글
(async () => {
  const box = document.getElementById('latest');
  if (!UL.configured) { document.getElementById('latest-panel').hidden = true; return; }
  const s = await UL.getSettings();
  if (s && s.notice) document.getElementById('garden-hint').textContent = s.notice;
  const { data, error } = await UL.client.from('posts').select('id, title, author_name, created_at').order('created_at', { ascending: false }).limit(5);
  if (error) { box.innerHTML = `<p class="msg error">글을 불러오지 못했어요: ${UL.esc(error.message)}</p>`; return; }
  if (!data.length) { box.innerHTML = '<p class="hint">아직 글이 없어요.</p>'; return; }
  box.innerHTML = '<ul>' + data.map(p => `<li><a href="board.html?id=${p.id}"><span class="t">${UL.esc(p.title)}</span><span class="m">${UL.esc(p.author_name)} · ${UL.fmtDate(p.created_at)}</span></a></li>`).join('') + '</ul>';
})();
</script>
</body>
</html>
