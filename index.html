<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underlume</title>
<meta name="description" content="3D 스캔 뷰어, 지도, 게시판, 참고자료">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500;1,6..96,600&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: center; min-height: 420px; }
  .hero h1 {
    font-family: var(--font-ko-display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(42px, 8.2vw, 108px); line-height: 0.92; letter-spacing: -0.03em;
    background: var(--dirt), linear-gradient(175deg, #f1e6d6 0%, #b9a58e 38%, #6d86d8 70%, #2f7bff 100%);
    background-size: 220px 220px, auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.9)) drop-shadow(0 0 26px rgba(47, 123, 255, 0.4));
  }
  .hero .ko { font-family: var(--font-ko-display); font-weight: 700; font-size: clamp(18px, 2.6vw, 23px); margin: 16px 0 10px; color: #d9cbb8; }
  .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .figure { position: relative; aspect-ratio: 3 / 4; max-width: 100%; justify-self: center; width: min(360px, 100%); }
  .figure svg { width: 100%; height: 100%; overflow: visible; }
  .figure .c { fill: none; stroke-linecap: round; filter: url(#heroglow); }
  @media (prefers-reduced-motion: reduce) { .figure .drip { display: none; } }

  .notice { display: flex; gap: 12px; align-items: baseline; }
  .notice .eyebrow { flex: none; }
  .notice p { margin: 0; white-space: pre-wrap; }

  .doors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .door {
    position: relative; text-decoration: none; color: var(--text);
    display: grid; gap: 8px; align-content: start; min-height: 130px;
    padding: 20px;
    background: var(--sweat), linear-gradient(165deg, rgba(30, 22, 19, 0.82), rgba(10, 13, 32, 0.92) 70%), var(--dirt), #221a16;
    background-size: 160px 120px, auto, 220px 220px, auto;
    clip-path: polygon(0 4%, 5% 0, 62% 2%, 96% 0, 100% 6%, 99% 58%, 100% 95%, 94% 100%, 40% 98%, 4% 100%, 0 93%, 1% 40%);
    overflow: hidden;
    transition: transform .2s, filter .2s;
  }
  .door::before { content: ""; position: absolute; inset: 0; border-top: 2px solid rgba(47, 123, 255, 0.55); pointer-events: none; }
  .door::after {
    content: ""; position: absolute; left: 50%; top: -40%; width: 240px; height: 240px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 160, 0.22), transparent 65%);
    opacity: 0; transition: opacity .25s;
  }
  .door:hover { transform: translateY(-3px); filter: brightness(1.15); color: var(--text); }
  .door:hover::after { opacity: 1; }
  .door .code { font-family: var(--font-mono); font-size: 11px; color: var(--uv-cyan); letter-spacing: .12em; }
  .door h3 { font-family: var(--font-ko-display); font-weight: 900; font-size: 21px; color: #f0e6d8; text-shadow: 0 -1px 0 #000; }
  .door p { margin: 0; color: var(--muted); font-size: 13px; }

  .latest { display: grid; gap: 14px; }
  .latest ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .latest li a { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); min-width: 0; }
  .latest li a:hover .t { color: var(--uv-cyan); }
  .latest .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .latest .m { color: var(--muted); font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }

  @media (max-width: 1080px) { .doors { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px) {
    .hero { grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .figure { width: min(240px, 70%); grid-row: 1; }
    .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 460px) { .doors { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body data-page="index">
<header id="site-header"></header>

<main class="shell">
  <section class="hero">
    <div>
      <h1 id="site-name">Underlume</h1>
      <p class="ko">3D 뷰어 · 지도 · 게시판 · 참고자료</p>
      <p class="lede">폰으로 스캔한 3D 파일을 열어 보고, 지도에 놓고, 게시판에 글을 남길 수 있어요.</p>
      <div class="actions">
        <a class="btn primary" href="viewer.html">내 집 3D로 보기</a>
        <a class="btn" href="board.html">게시판 가기</a>
      </div>
    </div>
    <div class="figure" aria-hidden="true">
      <svg viewBox="0 0 300 400">
        <defs>
          <linearGradient id="hg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63f0ff"/><stop offset=".55" stop-color="#7a5cff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
          <filter id="heroglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
          <filter id="mud" x="-40%" y="-40%" width="180%" height="180%">
            <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="2" result="n"/>
            <feColorMatrix in="n" values="0 0 0 0 .38  0 0 0 0 .27  0 0 0 0 .18  0 0 0 -2.2 1.35" result="g"/>
            <feComposite in="g" in2="SourceAlpha" operator="in" result="c"/>
            <feGaussianBlur in="c" stdDeviation=".6"/>
          </filter>
          <radialGradient id="bead" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="#bcd2ff" stop-opacity=".45"/><stop offset="1" stop-color="#2f5bd0" stop-opacity="0"/></radialGradient>
        </defs>
        <!-- 흙이 묻은 자리 -->
        <g filter="url(#mud)" opacity=".5">
          <ellipse cx="104" cy="160" rx="26" ry="40"/><ellipse cx="200" cy="230" rx="30" ry="46"/>
          <ellipse cx="88" cy="300" rx="22" ry="34"/><ellipse cx="214" cy="110" rx="18" ry="28"/>
        </g>
        <!-- 허리와 골반의 곡선 -->
        <g filter="url(#rough)">
          <path class="c" stroke="url(#hg1)" stroke-width="2.6" d="M 110 0 C 92 60, 88 110, 104 150 C 120 190, 128 205, 96 250 C 66 292, 64 340, 92 400" id="curveL"/>
          <path class="c" stroke="url(#hg1)" stroke-width="2.6" d="M 190 0 C 208 60, 212 110, 196 150 C 180 190, 172 205, 204 250 C 234 292, 236 340, 208 400" id="curveR"/>
          <path class="c" stroke="url(#hg1)" stroke-width="1" opacity=".5" d="M 128 0 C 114 70, 112 115, 124 150 C 136 185, 142 210, 118 250 C 96 290, 96 340, 116 400"/>
          <path class="c" stroke="url(#hg1)" stroke-width="1" opacity=".5" d="M 172 0 C 186 70, 188 115, 176 150 C 164 185, 158 210, 182 250 C 204 290, 204 340, 184 400"/>
        </g>
        <!-- 땀방울 -->
        <g fill="url(#bead)">
          <ellipse cx="101" cy="132" rx="4" ry="5"/><ellipse cx="114" cy="196" rx="3" ry="4"/><ellipse cx="80" cy="282" rx="5" ry="6"/>
          <ellipse cx="199" cy="128" rx="3.4" ry="4.4"/><ellipse cx="186" cy="206" rx="4.4" ry="5.6"/><ellipse cx="222" cy="300" rx="3" ry="4"/>
          <ellipse cx="150" cy="176" rx="2.4" ry="3"/><ellipse cx="146" cy="262" rx="3" ry="3.8"/>
          <ellipse class="drip" rx="3.6" ry="4.8"><animateMotion dur="7s" repeatCount="indefinite" rotate="0"><mpath href="#curveL"/></animateMotion></ellipse>
          <ellipse class="drip" rx="3" ry="4"><animateMotion dur="9s" begin="-3s" repeatCount="indefinite" rotate="0"><mpath href="#curveR"/></animateMotion></ellipse>
        </g>
      </svg>
    </div>
  </section>

  <section class="panel notice" id="notice" hidden>
    <p class="eyebrow">공지</p>
    <p id="notice-text"></p>
  </section>

  <section class="doors" aria-label="메뉴">
    <a class="door" href="viewer.html"><h3>3D 뷰어</h3><p>3D 스캔 파일 열기, 평면도, 걸어보기, 치수 재기, 벽에 사진 걸기</p></a>
    <a class="door" href="board.html"><h3>게시판</h3><p>글과 댓글 쓰기</p></a>
    <a class="door" href="map.html"><h3>지도</h3><p>3D 모델을 실제 위치에 놓고, 핀을 눌러 보기</p></a>
    <a class="door" href="refs.html"><h3>참고자료</h3><p>GitHub 추천 코드 10개 (방문할 때마다 바뀜)</p></a>
    <a class="door" href="account.html"><h3>계정</h3><p>가입·로그인, 관리자 설정</p></a>
  </section>

  <section class="panel latest">
    <div class="row"><h2 class="section-title">새 글</h2><span class="spacer"></span><a href="board.html">전체 보기</a></div>
    <div id="latest"><p class="hint">불러오는 중…</p></div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/underground.js"></script>
<script>
(async () => {
  const box = document.getElementById('latest');
  if (!UL.configured) { box.innerHTML = UL.setupNotice(); return; }
  const s = await UL.getSettings();
  if (s) {
    if (s.site_name) { document.getElementById('site-name').textContent = s.site_name; document.title = s.site_name; }
    if (s.notice) { document.getElementById('notice-text').textContent = s.notice; document.getElementById('notice').hidden = false; }
  }
  const { data, error } = await UL.client.from('posts').select('id, title, author_name, created_at').order('created_at', { ascending: false }).limit(5);
  if (error) { box.innerHTML = `<p class="msg error">글을 불러오지 못했어요: ${UL.esc(error.message)}</p>`; return; }
  if (!data.length) { box.innerHTML = '<p class="hint">아직 글이 없어요.</p>'; return; }
  box.innerHTML = '<ul>' + data.map(p => `<li><a href="board.html?id=${p.id}"><span class="t">${UL.esc(p.title)}</span><span class="m">${UL.esc(p.author_name)} · ${UL.fmtDate(p.created_at)}</span></a></li>`).join('') + '</ul>';
})();
</script>
</body>
</html>
